document.getElementById('monthly-report-btn').onclick = ()=>{
  const card = document.getElementById('monthly-report-card');
  if(card.innerHTML){ card.innerHTML=''; return; }
  const year = calViewDate.getFullYear(), month = calViewDate.getMonth();
  const monthLabel = calViewDate.toLocaleString(undefined, {month:'long', year:'numeric'});
  const inMonth = s=>{ const [y,m] = s.date.split('-').map(Number); return y===year && (m-1)===month; };

  let totalSets=0, totalVolume=0, exercisesTrained=new Set(), trainingDays=new Set(), prsThisMonth=[];
  Object.entries(data.logs).forEach(([name, arr])=>{
    const monthEntries = arr.filter(inMonth);
    if(monthEntries.length===0) return;
    exercisesTrained.add(name);
    monthEntries.forEach(s=>{
      totalSets++;
      totalVolume += s.weight*s.reps;
      trainingDays.add(s.date);
    });
    const pr = computePR(name);
    if(pr && !pr.hasSides && inMonth(pr.best)) prsThisMonth.push(name);
    if(pr && pr.hasSides){
      Object.entries(pr.sides).forEach(([side,s])=>{ if(inMonth(s)) prsThisMonth.push(name+' ('+side+')'); });
    }
  });

  card.innerHTML = `
    <div class="report-card">
      <h3>${monthLabel}</h3>
      <div class="report-stat-row"><span>Training days</span><b>${trainingDays.size}</b></div>
      <div class="report-stat-row"><span>Total sets logged</span><b>${totalSets}</b></div>
      <div class="report-stat-row"><span>Total volume</span><b>${Math.round(totalVolume).toLocaleString()}</b></div>
      <div class="report-stat-row"><span>Exercises trained</span><b>${exercisesTrained.size}</b></div>
      <div class="report-stat-row"><span>New PRs this month</span><b>${prsThisMonth.length}</b></div>
      ${prsThisMonth.length ? `<div style="margin-top:12px; color:var(--text-dim); font-size:12.5px; line-height:1.6;">${prsThisMonth.join(', ')}</div>` : ''}
    </div>
  `;
};

/* ---------- Weekly-program flow (Day -> auto Week -> Exercise -> Sets) ---------- */
const ARMWRESTLING_DAYS = ['Day 1','Day 2','Day 3','Day 4'];
function getArmCursor(){
  if(!data.armwrestlingCursor) data.armwrestlingCursor = {day:'Day 1', week:0};
  return data.armwrestlingCursor;
}
function advanceArmCursor(){
  const cur = getArmCursor();
  const idx = ARMWRESTLING_DAYS.indexOf(cur.day);
  if(idx < ARMWRESTLING_DAYS.length-1){
    cur.day = ARMWRESTLING_DAYS[idx+1];
  } else {
    cur.day = ARMWRESTLING_DAYS[0];
    cur.week = (cur.week+1) % 4;
  }
  save();
}
function dayExercises(cat, day){
  return (data.categories[cat]||[]).filter(e=>e.day===day && e.plan);
}
function computeDayWeekIndex(cat, day){
  const dates = new Set();
  dayExercises(cat, day).forEach(e=>{
    (data.logs[e.name]||[]).forEach(s=>{ if(s.date!==todayStr()) dates.add(s.date); });
  });
  return dates.size % 4;
}

function renderWeekSelect(){
  const el = document.getElementById('week-select-list');
  const days = [...new Set((data.categories[currentProgramCategory]||[]).map(e=>e.day).filter(Boolean))];
  const orderedDays = ARMWRESTLING_DAYS.filter(d=>days.includes(d)).concat(days.filter(d=>!ARMWRESTLING_DAYS.includes(d)));
  const cursor = getArmCursor();
  el.innerHTML = orderedDays.map(day=>{
    const wkIdx = computeDayWeekIndex(currentProgramCategory, day);
    const isNext = day===cursor.day;
    return `
      <div class="exercise-item" data-day-btn="${day}" style="border-radius:14px; border:1px solid ${isNext?'var(--pumpkin)':'var(--line)'}; margin-bottom:10px; background:var(--surface); padding:18px 17px;">
        <span style="font-size:16px; font-weight:600;">${day}${isNext ? '<span class="next-dot"></span><span class="next-badge">NEXT</span>' : ''}</span>
        <span style="color:var(--text-dim); font-size:13px;">Week ${wkIdx+1} of 4 ›</span>
      </div>
    `;
  }).join('');
  el.querySelectorAll('[data-day-btn]').forEach(btn=>{
    btn.onclick = ()=>{
      currentProgramDay = btn.dataset.dayBtn;
      currentProgramWeek = computeDayWeekIndex(currentProgramCategory, currentProgramDay);
      pushScreen('week-exercises');
    };
  });
}

function renderWeekExercises(){
  const el = document.getElementById('week-exercises-list');
  const exercises = dayExercises(currentProgramCategory, currentProgramDay);
  el.innerHTML = exercises.map(e=>{
    if(e.mode==='531'){
      const tmLabel = e.tm ? e.tm+' lb TM' : 'Not set up';
      return `
        <div class="exercise-item" data-ex-open="${e.name}" style="border-radius:14px; border:1px solid var(--line); margin-bottom:10px; background:var(--surface); padding:15px 17px; flex-direction:column; align-items:stretch; gap:4px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">

        <div style="display:flex; justify-content:space-between; align-items:center;">

          <span style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px;">${weightLabel}</span>
        </div>

  const cursor = getArmCursor();

    </button>

  el.querySelectorAll('[data-ex-open]').forEach(item=>{

      popScreen();
    } else {

      showToast('Marked '+currentProgramDay+' as next up');
      popScreen();

}

function ensureSideFields(ex){
  if(typeof ex.progressOffset !== 'object' || ex.progressOffset===null){
    ex.progressOffset = {LH:0, RH:0};
  }
  if(typeof ex.progressCheckedUpTo !== 'object' || ex.progressCheckedUpTo===null){
    ex.progressCheckedUpTo = {LH:null, RH:null};
  }
}
function applyPlanProgression(ex){
  ensureSideFields(ex);
  ['LH','RH'].forEach(side=>{
    const priorLogs = (data.logs[ex.name]||[]).filter(s=>s.date!==todayStr() && s.side===side);
    if(priorLogs.length===0) return;
    const dates = [...new Set(priorLogs.map(s=>s.date))].sort();
    const lastDate = dates[dates.length-1];
    if(ex.progressCheckedUpTo[side] === lastDate) return;
    const lastSessionEntries = priorLogs.filter(s=>s.date===lastDate);
    const wkNum = lastSessionEntries[0].plannedWeek;
    if(wkNum && ex.plan[wkNum-1]){
      const wkPlan = ex.plan[wkNum-1];
      const isME = /MAX EFFORT/i.test(wkPlan.scheme||'');
      const allPassed = isME
        ? (lastSessionEntries.length>0 && lastSessionEntries.every(s=>!s.failed))
        : (lastSessionEntries.length >= wkPlan.sets && lastSessionEntries.every(s=>!s.failed));
      if(allPassed){
        ex.progressOffset[side] = (ex.progressOffset[side]||0) + 5;
        showToast(ex.name+' ('+side+') — full session completed, +5 lb next time 🎉');
      }
    }
    ex.progressCheckedUpTo[side] = lastDate;
  });
  save();
}

function renderWeekLog(){
  const outer = document.getElementById('week-log-content');
  const ex = findExercise(currentExercise);
  outer.innerHTML = `
    <div class="mode-switch">
      <button data-wl-mode="regular" class="${ex.mode!=='531'?'active':''}">Sheet Plan</button>
      <button data-wl-mode="531" class="${ex.mode==='531'?'active':''}">5/3/1</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-wl-tab="sets">Sets</button>
      <button class="tab" data-wl-tab="history">History</button>
      <button class="tab" data-wl-tab="graph">Graph</button>
    </div>
    <div id="wl-sets" class="tab-panel active"></div>
    <div id="wl-history" class="tab-panel"></div>
    <div id="wl-graph" class="tab-panel">
      <div class="chart-wrap"><svg id="wl-chart" viewBox="0 0 340 170" width="100%"></svg></div>
      <div class="label" id="wl-graph-caption" style="text-align:center; color:var(--text-dim); font-size:13px;">Estimated 1-rep max over time</div>
    </div>
  `;
  outer.querySelectorAll('[data-wl-mode]').forEach(b=>{
    b.onclick = ()=>{ ex.mode = b.dataset.wlMode; save(); renderWeekLog(); };
  });
  outer.querySelectorAll('[data-wl-tab]').forEach(t=>{
    t.onclick = ()=>{
      outer.querySelectorAll('[data-wl-tab]').forEach(x=>x.classList.toggle('active', x===t));
      outer.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      outer.querySelector('#wl-'+t.dataset.wlTab).classList.add('active');
      if(t.dataset.wlTab==='history') renderHistory(ex.name, outer.querySelector('#wl-history'));
      if(t.dataset.wlTab==='graph') renderGraph(ex.name, outer.querySelector('#wl-chart'), outer.querySelector('#wl-graph-caption'));
    };
  });

  const setsEl = outer.querySelector('#wl-sets');
  if(ex.mode==='531'){
    renderTrack531(ex, setsEl, renderWeekLog);
    return;
  }

  applyPlanProgression(ex);
  ensureSideFields(ex);
  const wk = ex.plan[currentProgramWeek];
  const offsetLH = ex.progressOffset.LH||0;
  const offsetRH = ex.progressOffset.RH||0;
  const baseWeight = wk.weight!==null && typeof wk.weight==='number' ? wk.weight : null;
  const suggestedLH = baseWeight!==null ? baseWeight+offsetLH : null;
  const suggestedRH = baseWeight!==null ? baseWeight+offsetRH : null;
  const todaysAll = (data.logs[ex.name]||[]).filter(s=>s.date===todayStr() && s.plannedWeek===currentProgramWeek+1 && !s.bbb);
  const todaysLH = todaysAll.filter(s=>s.side==='LH');
  const todaysRH = todaysAll.filter(s=>s.side==='RH');
  const isMaxEffort = /MAX EFFORT/i.test(wk.scheme||'');

  if(lastMEKey !== (ex.name+currentProgramWeek)){
    lastMEKey = ex.name+currentProgramWeek;
    meSetCount = wk.sets;
  }
  const setCount = isMaxEffort ? Math.max(meSetCount, todaysLH.length, todaysRH.length) : wk.sets;

  function sideBlock(side, entries, suggested){
    let html = '';
    for(let i=0;i<setCount;i++){
      const entry = entries[i];
      const isDone = !!entry;
      const isFailed = isDone && entry.failed;
      const isPassed = isDone && !entry.failed;
      const rowWeight = suggested!==null
        ? (isMaxEffort ? suggested - 5*(setCount-1-i) : suggested)
        : null;
      html += `
        <div class="side-set-row">
          <div class="side-set-info">
            <div class="num">${isDone ? entry.weight : (rowWeight!==null ? rowWeight : '?')} lb</div>
            <div class="reps">${isFailed ? `<span class="failed-tag">missed · ${entry.reps}</span>` : (isPassed ? `${entry.reps} reps ✓` : `target ${wk.target}`)}</div>
          </div>
          <div class="set-actions">
            <button class="check-btn ${isPassed?'done':''}" data-side="${side}" data-i="${i}" data-weight="${rowWeight}" data-action="pass" ${isFailed?'disabled':''}>✓</button>
            <button class="fail-btn ${isFailed?'done':''}" data-side="${side}" data-i="${i}" data-weight="${rowWeight}" data-action="fail" ${isPassed?'disabled':''}>✕</button>
          </div>
        </div>`;
    }
    return html;
  }

  const allDone = todaysLH.length>=setCount && todaysRH.length>=setCount;

  const meStepperHtml = isMaxEffort ? `
    <div class="guide-top" style="margin-top:-4px; margin-bottom:14px;">
      <span class="label" style="margin-bottom:0;">Sets today (top set = LH ${suggestedLH??'?'} / RH ${suggestedRH??'?'} lb)</span>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="step-btn" style="width:34px; height:34px; font-size:18px;" id="me-minus">−</button>
        <span style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:18px; min-width:20px; text-align:center;">${meSetCount}</span>
        <button class="step-btn" style="width:34px; height:34px; font-size:18px;" id="me-plus">+</button>
      </div>
    </div>
  ` : '';

  setsEl.innerHTML = `
    <div class="guide-card" style="border-left-color:var(--yellow);">
      <div class="guide-top">
        <span class="week-badge" style="margin-bottom:0;">Week ${currentProgramWeek+1} ${wk.scheme ? '· '+wk.scheme : ''}</span>
      </div>
      ${meStepperHtml}
      <div class="side-columns">
        <div class="side-col">
          <div class="side-heading">LEFT HAND${offsetLH>0?` <span style="color:var(--pumpkin); font-weight:600;">+${offsetLH}</span>`:''}</div>
          ${sideBlock('LH', todaysLH, suggestedLH)}
        </div>
        <div class="side-col">
          <div class="side-heading">RIGHT HAND${offsetRH>0?` <span style="color:var(--pumpkin); font-weight:600;">+${offsetRH}</span>`:''}</div>
          ${sideBlock('RH', todaysRH, suggestedRH)}
        </div>
      </div>
    </div>
    ${allDone ? `<div class="complete-banner">✅ All sets logged for both hands. Complete every set clean next time and that side goes up another 5 lb.</div>` : ''}
    <button class="rest-btn" id="week-log-rest">Start rest timer</button>
  `;
  setsEl.querySelector('#week-log-rest').onclick = ()=> openTimer();
  if(isMaxEffort){
    setsEl.querySelector('#me-minus').onclick = ()=>{ if(meSetCount>Math.max(todaysLH.length,todaysRH.length)) meSetCount--; renderWeekLog(); };
    setsEl.querySelector('#me-plus').onclick = ()=>{ meSetCount++; renderWeekLog(); };
  }

  setsEl.querySelectorAll('[data-i]').forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.i);
      const side = btn.dataset.side;
      const entries = side==='LH' ? todaysLH : todaysRH;
      const already = entries[i];
      if(already){
        const realIdx = data.logs[ex.name].indexOf(already);
        data.logs[ex.name].splice(realIdx,1);
        save(); renderWeekLog();
        return;
      }
      const action = btn.dataset.action;
      const rowWeight = parseFloat(btn.dataset.weight);
      const defaultWeight = !isNaN(rowWeight) ? rowWeight : '';
      const weightVal = prompt(side+' — weight used for set '+(i+1)+' (lb):', defaultWeight);
      if(weightVal===null) return;
      const weight = parseFloat(weightVal);
      if(isNaN(weight)){ showToast('Enter a valid weight'); return; }
      let reps, failed;
      if(action==='fail'){
        const repsVal = prompt('How many reps/seconds did you actually complete?');
        if(repsVal===null) return;
        const num = parseInt(repsVal);
        if(isNaN(num)||num<0){ showToast('Enter a valid number'); return; }
        reps = num;
        failed = (typeof wk.target==='number') ? (num < wk.target) : false;
      } else {
        reps = wk.target; failed = false;
      }
      if(!data.logs[ex.name]) data.logs[ex.name]=[];
      data.logs[ex.name].push({date:todayStr(), plannedWeek:currentProgramWeek+1, weight, reps, failed, side});
      save();
      renderWeekLog();
    };
  });
}

/* ---------- Protein tracker ---------- */
const PROTEIN_FOOD_DB = [
  {id:'chicken_breast', name:'Chicken breast', type:'grams', proteinPer100g:31, unitLabel:'g'},
  {id:'chicken_wings',  name:'Chicken wings',   type:'grams', proteinPer100g:30, unitLabel:'g'},
  {id:'chicken_drumstick', name:'Chicken drumstick', type:'grams', proteinPer100g:28, unitLabel:'g'},
  {id:'milk', name:'Milk', type:'grams', proteinPer100g:3.3, unitLabel:'ml'},
  {id:'egg', name:'Egg', type:'egg', sizes:{small:5, medium:6, large:6.5}},
  {id:'protein_shake', name:'Protein shake', type:'direct'},
];
let selectedProteinFood = null;   // matched entry from PROTEIN_FOOD_DB, or null for custom/freeform
let proteinEntryMode = 'calc';    // 'calc' (from amount) or 'manual' (direct grams), for type:'grams' foods
let proteinEggSize = 'medium';
let proteinViewDate = todayStr();
function shiftDateStr(dStr, delta){
  const [y,m,d] = dStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return formatDate(dt);
}
function proteinTotalFor(dStr){
  const entries = (data.protein.entries[dStr]||[]);
  return entries.reduce((sum,e)=> sum+e.grams, 0);
}
function renderProtein(){
  const dStr = proteinViewDate;
  document.getElementById('protein-date-label').textContent = (dStr===todayStr()) ? 'Today' : formatDateLabel(dStr);
  const total = proteinTotalFor(dStr);
  const goal = data.protein.goal || 120;
  const pct = Math.min(100, Math.round((total/goal)*100));
  document.getElementById('protein-total').textContent = total+'g';
  document.getElementById('protein-goal-display').textContent = goal+'g';
  document.getElementById('protein-bar').style.width = pct+'%';
  document.getElementById('protein-bar').classList.toggle('done', pct>=100);
  document.getElementById('protein-pct').textContent = pct>=100 ? '🎉 Goal reached' : pct+'% of goal';

  const entries = data.protein.entries[dStr]||[];
  const list = document.getElementById('protein-entries-list');
  if(entries.length===0){
    list.innerHTML = '<div class="empty">Nothing logged for this day yet.</div>';
  } else {
    list.innerHTML = entries.map((e,i)=>`
      <div class="protein-entry">
        <span class="pname">${e.label}</span>
        <span class="pgrams">${e.grams}g <button class="pdel" data-protein-del="${i}">✕</button></span>
      </div>
    `).join('');
    list.querySelectorAll('[data-protein-del]').forEach(btn=>{
      btn.onclick = ()=>{
        entries.splice(parseInt(btn.dataset.proteinDel),1);
        save(); renderProtein();
      };
    });
  }
}
document.getElementById('protein-prev-day').onclick = ()=>{ proteinViewDate = shiftDateStr(proteinViewDate,-1); renderProtein(); };
document.getElementById('protein-next-day').onclick = ()=>{ proteinViewDate = shiftDateStr(proteinViewDate,1); renderProtein(); };
document.getElementById('protein-goal-card').onclick = ()=>{
  const val = prompt('Daily protein goal (grams):', data.protein.goal);
  const num = parseFloat(val);
  if(!isNaN(num) && num>0){ data.protein.goal = num; save(); renderProtein(); }
};
function scrollProteinFocusIntoView(){
  const active = document.activeElement;

  if(!document.getElementById('screen-protein').contains(active)) return;

        </div>
        <div class="protein-calc-result" id="protein-calc-result">= 0g protein</div>
        <button class="protein-mode-toggle" id="protein-switch-manual">Enter protein directly instead</button>
      </div>`;
    document.getElementById('protein-amount-input').oninput = updateProteinCalcResult;
    document.getElementById('protein-switch-manual').onclick = ()=>{ proteinEntryMode='manual'; renderProteinCalcArea(); };
  }
}
function updateProteinCalcResult(){
  const f = selectedProteinFood;
  const resultEl = document.getElementById('protein-calc-result');
  if(!f || !resultEl) return;
  if(f.type==='egg'){
    const count = parseFloat(document.getElementById('protein-egg-count').value) || 0;
    resultEl.textContent = `= ${Math.round(count * f.sizes[proteinEggSize] * 10)/10}g protein`;
  } else if(f.type==='grams'){
    const amount = parseFloat(document.getElementById('protein-amount-input').value) || 0;
    resultEl.textContent = `= ${Math.round(amount * (f.proteinPer100g/100) * 10)/10}g protein`;
  }
}
document.getElementById('protein-label-input').addEventListener('input', ()=>{
  const val = document.getElementById('protein-label-input').value.trim();
  if(selectedProteinFood && val !== selectedProteinFood.name){
    selectedProteinFood = null;
  }
  renderProteinSuggestions();
  if(!val){
    document.getElementById('protein-calc-area').innerHTML = '';
  } else {
    renderProteinCalcArea();
  }
  scrollProteinFocusIntoView();
});
function resetProteinInputArea(){
  selectedProteinFood = null;
  proteinEntryMode = 'calc';
  proteinEggSize = 'medium';
  document.getElementById('protein-label-input').value = '';
  document.getElementById('protein-suggest-list').innerHTML = '';
  document.getElementById('protein-calc-area').innerHTML = '';
}
document.getElementById('protein-add-btn').onclick = ()=>{
  const labelInput = document.getElementById('protein-label-input');
  const label = labelInput.value.trim();
  if(!label){ showToast('Enter what you ate'); return; }

  let grams = null;
  const f = selectedProteinFood;

  if(f && f.type==='egg'){
    const count = parseFloat(document.getElementById('protein-egg-count').value);
    if(isNaN(count) || count<=0){ showToast('Enter how many eggs'); return; }
    grams = Math.round(count * f.sizes[proteinEggSize] * 10)/10;
    finishProteinAdd(`${count} egg${count!==1?'s':''} (${proteinEggSize})`, grams);
    return;
  }
  if(f && f.type==='grams' && proteinEntryMode==='calc'){
    const amount = parseFloat(document.getElementById('protein-amount-input').value);
    if(isNaN(amount) || amount<=0){ showToast('Enter the amount eaten'); return; }
    grams = Math.round(amount * (f.proteinPer100g/100) * 10)/10;
    finishProteinAdd(`${f.name} (${amount}${f.unitLabel})`, grams);
    return;
  }
  // direct-entry cases: type==='direct', manual mode, or custom freeform food
  const manualEl = document.getElementById('protein-manual-grams');
  grams = manualEl ? parseFloat(manualEl.value) : NaN;
  if(isNaN(grams) || grams<0){ showToast('Enter a valid gram amount'); return; }
  finishProteinAdd(label, grams);
};
function finishProteinAdd(label, grams){
  if(!data.protein.entries[proteinViewDate]) data.protein.entries[proteinViewDate] = [];
  data.protein.entries[proteinViewDate].push({label, grams});
  save();
  resetProteinInputArea();
  renderProtein();
}

document.getElementById('screen-protein').addEventListener('focusin', (e)=>{
  if(e.target.tagName==='INPUT') scrollProteinFocusIntoView();
});

/* ---------- Init ---------- */
setUnit(data.unit);
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
